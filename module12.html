<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 12</title>
  
</head>
<body>
    <h1>Module 12 Tasks</h1>

    <section>
        <h2>Click Event</h2>
        <button id="btn" type="button">Update Status</button>
        <p id="status">Status: waiting</p>
    </section>

    <section>
        <h2>Live Character Count</h2>
        <label for="message">Message:</label>
        <input id="message" type="text" placeholder="Type here...">
        <p>Character count: <span id="count">0</span></p>
    </section>

    <section>
        <h2>Registration Form</h2>
        <form id="registerForm">
            <label for="name">Name:</label><br>
            <input id="name" type="text" name="name"><br>

            <label for="email">Email:</label><br>
            <input id="email" type="email" name="email"><br>

            <button type="submit">Register</button>
        </form>
        <p id="result"></p>
    </section>

    <script src="module12.js"></script>
</body>
</html>
